name: Build APK

on:
  push:
    branches-ignore:
      - ci-logs
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        id: build
        run: |
          set -o pipefail
          gradle assembleDebug --stacktrace --no-daemon 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Upload APK artifact
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: VB-Launcher-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish APK to a pre-release
        if: steps.build.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk VB-Launcher-beta.apk
          gh release delete beta-latest --cleanup-tag --yes || true
          gh release create beta-latest VB-Launcher-beta.apk --prerelease --target "$GITHUB_SHA" --title "VB Launcher beta (Xclipse)" --notes "Автосборка из коммита ${GITHUB_SHA::7}"

      - name: Publish build log to ci-logs branch
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          {
            echo "outcome: ${{ steps.build.outcome }}"
            echo "commit: $GITHUB_SHA"
            echo "ref: $GITHUB_REF_NAME"
            echo
            echo "=== errors ==="
            grep -E "^e: |error:|FAILED|What went wrong|Execution failed|Could not " -A4 "$RUNNER_TEMP/build.log" | head -n 400 || true
            echo
            echo "=== tail ==="
            tail -n 120 "$RUNNER_TEMP/build.log" || true
          } > "$RUNNER_TEMP/out/build-status.txt"
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git checkout --orphan ci-logs-tmp
          git rm -rf . > /dev/null 2>&1 || true
          cp "$RUNNER_TEMP/out/build-status.txt" build-status.txt
          git add build-status.txt
          git commit -m "build log for ${GITHUB_SHA::7}"
          git push --force origin HEAD:refs/heads/ci-logs
